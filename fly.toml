app = "arnaudjalbert-escalographe"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_URL = "sqlite:////data/escalators.db"
  ENVIRONMENT = "production"
  STATIC_DIR = "/app/static"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
